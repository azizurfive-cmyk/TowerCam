
workflows:
  towercam-release:
    name: TowerCam Release APK
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      java: 17

      android_signing:
        - towercam_release_key

      groups:
        - firebase_config

    scripts:
      - name: Prepare Android and Firebase configuration
        script: |
          set -e

          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON is missing"
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON" > "$CM_BUILD_DIR/app/google-services.json"

          echo "Firebase configuration prepared."

      - name: Build TowerCam Release APK
        script: |
          set -e

          cd "$CM_BUILD_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon clean :app:assembleRelease
          elif command -v gradle >/dev/null 2>&1; then
            gradle --no-daemon clean :app:assembleRelease
          else
            echo "ERROR: Gradle Wrapper and system Gradle are both missing."
            exit 1
          fi

          echo "TowerCam Release APK build completed."

    artifacts:
      - app/build/outputs/apk/release/*.apk

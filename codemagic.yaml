workflows:
  towercam-release:
    name: TowerCam Release APK
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      java: 17

      android_signing:
        - towercam_release_key

      groups:
        - firebase_config

    scripts:
      - name: Prepare Android and Firebase configuration
        script: |
          set -e

          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON is missing"
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON" > "$CM_BUILD_DIR/app/google-services.json"

          echo "Firebase configuration prepared."

      
      - name: Build TowerCam Release APK
        script: |
          set -e

          cd "$CM_BUILD_DIR"

          echo "Downloading Gradle 9.3.1..."

          curl -fL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /tmp

          GRADLE=/tmp/gradle-9.3.1/bin/gradle

          echo "Checking Gradle version..."
          "$GRADLE" --version

          echo "Building TowerCam..."

          "$GRADLE" \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            clean :app:assembleRelease

          echo "TowerCam Release APK build completed."
    artifacts:
      - app/build/outputs/apk/release/*.apk
